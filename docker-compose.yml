# configura o serviço POSTGRES usando a última versão disponível e credenciais específicas
services:
  postgres:
    image: postgres:latest
    container_name: crypto_db
    env_file:
      - .env
    environment:
      - POSTGRES_DB: ${POSTGRES_DB}
      - POSTGRES_USER: ${POSTGRES_USER}
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - ${PORTS}:${PORTS}
    
volumes: 
  postgres-data:
